<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Jimny Tyre Calls</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column, workshop-ticket feel; sidewall-code mono for sizes and prices */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #1c2229; --muted: #5d6670; --line: #d9ddd6;
  --accent: #b5650d; --accent-soft: #f6e7d3;
  --good: #2f7d4a; --good-soft: #e2f1e6; --warn: #a86b00; --warn-soft: #f7ecd3; --bad: #a83a32; --bad-soft: #f6e1df;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191e; --surface: #1d232a; --ink: #e8ebe6; --muted: #9aa3ad; --line: #2e363f;
  --accent: #e39a45; --accent-soft: #3a2a17;
  --good: #6cc48a; --good-soft: #1d3326; --warn: #e0b04f; --warn-soft: #3a2f17; --bad: #e57d74; --bad-soft: #3b211f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191e; --surface: #1d232a; --ink: #e8ebe6; --muted: #9aa3ad; --line: #2e363f;
  --accent: #e39a45; --accent-soft: #3a2a17;
  --good: #6cc48a; --good-soft: #1d3326; --warn: #e0b04f; --warn-soft: #3a2f17; --bad: #e57d74; --bad-soft: #3b211f; color-scheme: dark }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 22px; font-weight: 700; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; font-weight: 700; margin-top: 24px; }
p, li { max-width: 68ch; }
a { color: var(--accent); }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.lede { font-size: 17px; margin-top: 14px; }
.spec { display: inline-block; font: 500 13px var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; background: var(--surface); }
.bottomline { margin-top: 24px; background: var(--accent-soft); border-left: 4px solid var(--accent); padding: 16px 18px; border-radius: 0 6px 6px 0; }
.bottomline p { margin: 6px 0 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 24px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.stat b { display: block; font: 700 26px var(--f-display); }
.stat span { font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 600px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
th { font: 500 12px var(--f-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; white-space: nowrap; }
tr.best td { background: var(--good-soft); }
.pill { display: inline-block; font: 500 11px/1 var(--f-mono); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
.pill.quoted { background: var(--good-soft); color: var(--good); }
.pill.partial { background: var(--warn-soft); color: var(--warn); }
.pill.failed { background: var(--bad-soft); color: var(--bad); }
.pill.none { background: var(--line); color: var(--muted); }
details.call { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; }
details.call summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
details.call summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shop { font-weight: 600; }
.meta { color: var(--muted); font-size: 13px; }
.note { margin: 0; padding: 0 14px 10px; color: var(--muted); font-size: 14px; }
.transcript { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: grid; gap: 6px; }
.turn { display: grid; grid-template-columns: 42px 52px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.turn .ts { font: 12px var(--f-mono); color: var(--muted); padding-top: 2px; text-align: right; }
.turn .who { font: 500 12px var(--f-mono); padding-top: 2px; }
.turn.agent .who { color: var(--accent); }
.turn.user .who { color: var(--muted); }
.lessons li, .recs li { margin-top: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.cols > div { min-width: 0; }
.footer { margin-top: 56px; font-size: 13px; color: var(--muted); }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.flow.back { margin-top: 6px; }
.node { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: 500 13px var(--f-mono); }
.node small { font: 400 11px var(--f-body); color: var(--muted); }
.node.shop { border-color: var(--accent); }
.node.bad { background: var(--bad-soft); border-color: var(--bad); }
.node.good { background: var(--good-soft); border-color: var(--good); }
.arr { color: var(--muted); font: 15px var(--f-mono); }
/* lock screen */
.lock { min-height: 70vh; display: grid; place-items: center; }
.lockbox { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
.lockbox h1 { font-size: 22px; }
.lockbox label { display: block; margin-top: 16px; font-size: 13px; color: var(--muted); }
.lockbox input { width: 100%; box-sizing: border-box; margin-top: 6px; font: 15px var(--f-mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.lockbox input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.lockbox button { margin-top: 12px; width: 100%; font: 600 15px var(--f-body); padding: 10px; border: 0; border-radius: 6px; background: var(--ink); color: var(--bg); cursor: pointer; }
.lockbox button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--bad); font-size: 14px; min-height: 1.4em; margin: 10px 0 0; }
</style>

<div class="wrap">
  <div class="lock" id="lock">
    <form class="lockbox" id="unlock">
      <div class="eyebrow">Private report</div>
      <h1>Jimny tyre calls</h1>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit">Unlock</button>
      <p class="err" id="err" role="alert"></p>
      <p class="muted" style="font-size:13px;margin:4px 0 0">The report is encrypted in this page and opens only with the password.</p>
    </form>
  </div>
  <main id="report" hidden></main>
</div>

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

    const r = document.getElementById("report");
